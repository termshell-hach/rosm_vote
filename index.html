<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSM Ethical Hacking - Developers Vote</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-color: #00ff66;
            --accent-hover: #00cc52;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* بطاقة الإحصائيات والدول الأكثر تصويتاً */
        .stats-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .stats-title {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 3px solid var(--accent-color);
            padding-left: 10px;
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .country-item {
            background-color: rgba(31, 41, 55, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .country-item:hover {
            border-color: var(--accent-color);
        }

        .country-flag {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .country-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 3px;
        }

        .country-rank {
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        /* بقية التصاميم الخاصة بالقائمة والتعليقات */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .dev-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(31, 41, 55, 0.5);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .dev-card:hover {
            border-color: var(--accent-color);
        }

        .dev-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dev-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
        }

        .dev-details h3 {
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .dev-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .vote-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .vote-btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .vote-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .comment-item {
            background-color: rgba(31, 41, 55, 0.3);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .comment-author {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .comment-body {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-top: 4px;
        }

        #commentInput {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            resize: vertical;
            min-height: 80px;
            margin-bottom: 10px;
        }

        #commentInput:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: none;
        }

        @media (max-width: 600px) {
            .countries-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ROSM Ethical Hacking</h1>
            <p>Top Developers Community Vote</p>
        </header>

        <!-- بطاقة الإحصائيات: الدول الأكثر تصويتاً -->
        <div class="stats-card">
            <div class="stats-title">Top Voting Countries</div>
            <div class="countries-grid">
                <div class="country-item">
                    <div class="country-flag">🇷🇺</div>
                    <div class="country-name">Russia</div>
                    <div class="country-rank">#1 Rank</div>
                </div>
                <div class="country-item">
                    <div class="country-flag">🇮🇷</div>
                    <div class="country-name">Iran</div>
                    <div class="country-rank">#2 Rank</div>
                </div>
                <div class="country-item">
                    <div class="country-flag">🇪🇸</div>
                    <div class="country-name">Spain</div>
                    <div class="country-rank">#3 Rank</div>
                </div>
            </div>
        </div>

        <!-- قسم المطورين والتصويت -->
        <div class="card">
            <div id="closedBanner" style="display:none; color:#ff4444; margin-bottom:15px; font-weight:bold; text-align:center;">Voting Has Ended</div>
            <div id="globalTotalVotes" style="font-weight:bold; color:var(--text-muted); margin-bottom:15px;"></div>
            <div id="developersList"></div>
        </div>

        <!-- قسم التعليقات -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="font-size:1.2rem;">Community Discussion</h3>
                <span id="openModalBtn" style="color:var(--text-muted); font-size:0.9rem;"></span>
            </div>

            <div id="commentFormContainer" style="flex-direction:column;">
                <div id="commentError" class="error-msg"></div>
                <textarea id="commentInput" placeholder="Write a comment (English, Spanish and Russian) only..."></textarea>
                <button class="vote-btn" onclick="postComment()">Post Comment</button>
            </div>
            <div id="commentNotice" style="display:none; color:var(--accent-color); font-size:0.9rem; margin-bottom:15px;">You have already posted your comment.</div>

            <div id="commentsList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>
