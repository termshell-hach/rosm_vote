    <!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 ROSM Ethical Hacking Developers Vote</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #222;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            font-size: 14px;
            color: #555;
            text-align: center;
            max-width: 450px;
            margin: 10px auto 20px auto;
            line-height: 1.5;
        }
        #developersList {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .dev-card {
            background: #f9f9f9;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dev-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .dev-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .dev-details h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        .dev-details p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }
        .vote-btn {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .vote-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Top 10 ROSM Ethical Hacking Developers</h1>
    <p class="subtitle">Vote for your favorite developer, penetrational and track the live leaderboard #Розем для коллекции</p>

    <div id="developersList"></div>

    <script>
        const endDate = new Date("2026-08-05T00:00:00").getTime();
        const isEnded = new Date().getTime() > endDate;

        const developers = [
            { id: 1, name: "Nishail", img: "images/nishail.jpg", baseVotes: 15544 },
            { id: 2, name: "Olivias", img: "images/olivias.jpg", baseVotes: 15147 },
            { id: 3, name: "Sofía", img: "images/sofia.jpg", baseVotes: 14988 },
            { id: 4, name: "Yogesh", img: "images/yogesh.jpg", baseVotes: 14871 },
            { id: 5, name: "Patricia", img: "images/patricia.jpg", baseVotes: 13518 },
            // التنافس المشتعل والمتقارب يبدأ من المركز 6 إلى 10:
            { id: 6, name: "Risha", img: "images/risha.jpg", baseVotes: 9500 },
            { id: 7, name: "Alex", img: "images/alex.jpg", baseVotes: 9485 },
            { id: 8, name: "Daniel", img: "images/daniel.jpg", baseVotes: 9470 },
            { id: 9, name: "Marcus", img: "images/marcus.jpg", baseVotes: 9455 },
            { id: 10, name: "Lucas", img: "images/lucas.jpg", baseVotes: 9440 }
        ];

        function renderList() {
            let userVotesExtra = JSON.parse(localStorage.getItem('userVotesExtra') || '{}');

            let evaluatedDevs = developers.map(dev => {
                let extra = userVotesExtra[dev.id] || 0;
                return {
                    ...dev,
                    totalVotes: dev.baseVotes + extra
                };
            });

            evaluatedDevs.sort((a, b) => b.totalVotes - a.totalVotes);

            const listContainer = document.getElementById('developersList');
            listContainer.innerHTML = '';

            const hasVotedAny = localStorage.getItem('hasVotedAny') === 'true';

            evaluatedDevs.forEach((dev, index) => {
                let hasVotedForThis = localStorage.getItem(`voted_${dev.id}`) === 'true';

                const card = document.createElement('div');
                card.className = 'dev-card';
                card.innerHTML = `
                    <div class="dev-info">
                        <span style="font-weight:bold; width: 20px; color:#555;">#${index + 1}</span>
                        <img src="${dev.img}" alt="${dev.name}">
                        <div class="dev-details">
                            <h3>${dev.name}</h3>
                            <p id="votes-${dev.id}">${dev.totalVotes.toLocaleString()} votes</p>
                        </div>
                    </div>
                    <div class="vote-section">
                        <button class="vote-btn" id="btn-${dev.id}" 
                            onclick="voteFor(${dev.id})" 
                            ${(hasVotedAny || isEnded) ? 'disabled' : ''}>
                            ${hasVotedForThis ? 'Voted' : (hasVotedAny ? 'Locked' : 'Vote')}
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function voteFor(id) {
            const now = new Date().getTime();
            if (now > endDate) return;

            if (localStorage.getItem('hasVotedAny') === 'true') return;

            localStorage.setItem('hasVotedAny', 'true');
            localStorage.setItem(`voted_${id}`, 'true');

            let userVotesExtra = JSON.parse(localStorage.getItem('userVotesExtra') || '{}');
            userVotesExtra[id] = (userVotesExtra[id] || 0) + 1;
            localStorage.setItem('userVotesExtra', JSON.stringify(userVotesExtra));

            renderList();
        }

        renderList();
        setInterval(renderList, 60000);
    </script>
</body>
</html>
